			<stop offset="0" stop-color="#d48a6b" />
			<stop offset="1" stop-color="#a75f42" />
		</linearGradient>
		<radialGradient id="glow" cx="0.3" cy="0.25" r="0.6">
			<stop offset="0" stop-color="#fff" stop-opacity="0.28" />
