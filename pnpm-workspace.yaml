# firebase-admin's jwks-rsa require()s jose. jose@6 is ESM-only, and Vercel's
# function loader cannot require() ES modules (ERR_REQUIRE_ESM on every server
# route, even on Node 24). jose@5 has the same API for what jwks-rsa uses
# (importJWK, exportSPKI, decodeJwt, decodeProtectedHeader) and ships CommonJS.
overrides:
  'jwks-rsa>jose': ^5.10.0

allowBuilds:
  '@firebase/util': false
  esbuild: true
  protobufjs: false
