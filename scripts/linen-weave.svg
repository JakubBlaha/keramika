<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
	<!--
		SOURCE for static/textures/linen-weave.webp - edit, then run
		`pnpm render-linen`. The linen grain under scripts/linen.svg's
		embroidery: horizontal and vertical fibre noise, stitched so the tile
		repeats seamlessly, as faint warm-grey specks. Rendered opaque over
		white and applied with multiply, so it only darkens and works over any
		background colour.
	-->
	<defs>
		<filter id="weave" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
			<feTurbulence type="fractalNoise" baseFrequency="0.9 0.0125" numOctaves="2" seed="4" stitchTiles="stitch" result="warp" />
			<feTurbulence type="fractalNoise" baseFrequency="0.0125 0.9" numOctaves="2" seed="9" stitchTiles="stitch" result="weft" />
			<feBlend in="warp" in2="weft" mode="multiply" />
			<feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.38  0 0 0 0 0.35  -0.22 0 0 0 0.09" />
		</filter>
	</defs>
	<rect width="320" height="320" filter="url(#weave)" />
</svg>
